spring.application.name=sblangchain

server.port=${SERVER_PORT:8086}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/practice?serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

assistant.llm.gemini.enabled=${GEMINI_ENABLED:N}
assistant.llm.gemini.api-key=${GEMINI_API_KEY:}
assistant.llm.gemini.model=${GEMINI_MODEL:gemini-3.8-flash}

assistant.llm.groq.enabled=${GROQ_ENABLED:N}
assistant.llm.groq.api-key=${GROQ_API_KEY:}
assistant.llm.groq.model=${GROQ_MODEL:openai/gpt-oss-120b}

assistant.llm.ollama.enabled=${OLLAMA_ENABLED:Y}
assistant.llm.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
assistant.llm.ollama.model=${OLLAMA_MODEL:llama3.1}
assistant.llm.ollama.timeout=${OLLAMA_TIMEOUT:300s}
assistant.llm.ollama.max-retries=${OLLAMA_MAX_RETRIES:5}
